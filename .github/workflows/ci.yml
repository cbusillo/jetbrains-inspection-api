---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main
      - "launchplane/train/**"

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  full-release:
    needs: commit-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/agents-release.yml
    secrets:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

  commit-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Record job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint GitHub Actions workflows for pull requests
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1
        with:
          fail_level: error
          reporter: github-pr-annotations

      - name: Lint GitHub Actions workflows for pushes
        if: github.event_name == 'push'
        uses: reviewdog/action-actionlint@a8ac3eea598697a830f7d8e701fc9fcbfde88974 # v1
        with:
          fail_level: error
          reporter: github-check

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh

      - name: Set up uv for smoke lifecycle tests
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Test smoke lifecycle and local installer behavior
        run: |
          uv run scripts/test-smoke-lifecycle.py
          ./scripts/test-red-lane-smoke-script.sh

      - name: List pull request changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed_files="$RUNNER_TEMP/changed-files.txt"
          if gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$changed_files"; then
            echo "COMMIT_GATE_CHANGED_FILES=$changed_files" >> "$GITHUB_ENV"
          fi

      - name: Run commit gate
        run: ./scripts/commit-gate.sh --ci

      - name: Report time budget
        if: always()
        env:
          TIME_BUDGET_SECONDS: "300"
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "commit-gate job took ${elapsed}s of a ${TIME_BUDGET_SECONDS}s budget." >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$TIME_BUDGET_SECONDS" ]; then
            echo "::warning title=CI time budget exceeded::commit-gate job took ${elapsed}s; the budget is ${TIME_BUDGET_SECONDS}s."
          fi

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            build/reports/tests/platformTest/
            inspection-core/build/reports/tests/test/
            mcp-server-jvm/build/reports/tests/test/
          retention-days: 7
