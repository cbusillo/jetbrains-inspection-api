---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  commit-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint GitHub Actions workflows for pull requests
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-actionlint@ab7138020abfe6cd20b742c82e5b7a9749fb5884 # v1
        with:
          fail_level: error
          reporter: github-pr-annotations

      - name: Lint GitHub Actions workflows for pushes
        if: github.event_name == 'push'
        uses: reviewdog/action-actionlint@ab7138020abfe6cd20b742c82e5b7a9749fb5884 # v1
        with:
          fail_level: error
          reporter: github-check

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh

      - name: Run commit gate
        run: ./scripts/commit-gate.sh --ci

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            inspection-core/build/reports/tests/test/
            mcp-server-jvm/build/reports/tests/test/
          retention-days: 7
