---
name: Full Build Release

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      digest: ${{ steps.digest.outputs.sha256 }}
      existing: ${{ steps.existing.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Identify immutable main source and version
        id: source
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          sha="$(git rev-parse HEAD)"
          sequence="$(git rev-list --first-parent --count HEAD)"
          version="$(uv run scripts/agents-release.py version --sequence "$sequence")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Reuse a verified published build on CI reruns
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          reuse="$(uv run scripts/agents-release.py reuse --repo "$GITHUB_REPOSITORY" \
            --version "$VERSION" --source-sha "$SOURCE_SHA" --directory "$RUNNER_TEMP/existing-release")"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Run gates for a manually requested release
        if: github.event_name == 'workflow_dispatch' && steps.existing.outputs.reuse != 'true'
        run: ./scripts/commit-gate.sh --ci
      - name: Build and verify the full plugin
        if: steps.existing.outputs.reuse != 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          ./gradlew --no-build-cache buildPlugin verifyPluginStructure "-PpluginVersion=$VERSION"
          archive="$PWD/build/distributions/jetbrains-inspection-api-$VERSION.zip"
          ./gradlew --no-build-cache verifyPlugin "-PpluginVersion=$VERSION" "-PpluginVerificationArchive=$archive"
      - name: Preserve compatibility reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-build-verifier
          path: build/reports/pluginVerifier/
          if-no-files-found: warn
          retention-days: 30
      - name: Validate provenance and generate the custom repository
        if: steps.existing.outputs.reuse != 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/full-release"
          cp "build/distributions/jetbrains-inspection-api-$VERSION.zip" "$RUNNER_TEMP/full-release/"
          uv run scripts/agents-release.py feed \
            --archive "$RUNNER_TEMP/full-release/jetbrains-inspection-api-$VERSION.zip" \
            --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/agents%2Fv$VERSION/jetbrains-inspection-api-$VERSION.zip" \
            --output "$RUNNER_TEMP/full-release/updatePlugins.xml"
      - name: Record archive digest
        id: digest
        if: steps.existing.outputs.reuse != 'true'
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/full-release"
          sha256sum "jetbrains-inspection-api-$VERSION.zip" updatePlugins.xml > SHA256SUMS
          echo "sha256=$(sha256sum "jetbrains-inspection-api-$VERSION.zip" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.existing.outputs.reuse != 'true'
        with:
          name: full-release
          path: ${{ runner.temp }}/full-release/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: package
    if: needs.package.outputs.existing != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: full-release-${{ needs.package.outputs.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.package.outputs.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: full-release
          path: artifact
      - name: Publish or verify immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          SOURCE_SHA: ${{ needs.package.outputs.sha }}
          EXPECTED_DIGEST: ${{ needs.package.outputs.digest }}
        run: |
          test "$(sha256sum "artifact/jetbrains-inspection-api-$VERSION.zip" | cut -d ' ' -f1)" = "$EXPECTED_DIGEST"
          printf 'Full proof and recovery build from %s.\n\nArchive SHA-256: %s\n\nAdd this repository once in Settings → Plugins → Manage Plugin Repositories:\n\nhttps://github.com/%s/releases/latest/download/updatePlugins.xml\n\nThe IDE will offer subsequent full-build updates. Marketplace Stable approval is separate.\n' \
            "$SOURCE_SHA" "$EXPECTED_DIGEST" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          uv run scripts/agents-release.py publish --repo "$GITHUB_REPOSITORY" \
            --directory artifact --version "$VERSION" --source-sha "$SOURCE_SHA" --notes "$RUNNER_TEMP/notes.md"

  latest:
    needs: [package, release]
    if: >-
      always() && needs.package.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: full-release-latest
      cancel-in-progress: false
    steps:
      - name: Advance the automatic update repository
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -E '^agents/v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          version="${tag#agents/v}"
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" != "$tag" ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
          fi
          mkdir -p "$RUNNER_TEMP/expected-feed" "$RUNNER_TEMP/public-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern updatePlugins.xml --dir "$RUNNER_TEMP/expected-feed"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/public-release"
          curl --fail --silent --show-error --location \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/updatePlugins.xml" \
            --output "$RUNNER_TEMP/public-release/updatePlugins.xml"
          cmp "$RUNNER_TEMP/expected-feed/updatePlugins.xml" "$RUNNER_TEMP/public-release/updatePlugins.xml"
          download_url="$(python3 -c 'import sys, xml.etree.ElementTree as E; print(E.parse(sys.argv[1]).getroot().find("plugin").get("url"))' "$RUNNER_TEMP/public-release/updatePlugins.xml")"
          curl --fail --silent --show-error --location "$download_url" \
            --output "$RUNNER_TEMP/public-release/jetbrains-inspection-api-$version.zip"
          (cd "$RUNNER_TEMP/public-release" && sha256sum --check SHA256SUMS)
